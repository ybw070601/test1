<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF家族 微博数据监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 2em;
        }
        .update-time {
            text-align: center;
            color: #7f8c8d;
            margin: 10px 0 25px;
            font-size: 0.9em;
        }
        .section-title {
            font-size: 1.3em;
            color: #2c3e50;
            margin: 25px 0 10px;
            padding-bottom: 6px;
            border-bottom: 3px solid #3498db;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            background: white;
        }
        th {
            background: #34495e;
            color: white;
            padding: 14px 12px;
            font-weight: 500;
            font-size: 0.95em;
        }
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
        }
        .badge {
            background: #3498db;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        .increment {
            font-weight: 600;
            color: #27ae60;
        }
        .increment.negative {
            color: #e74c3c;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌟 TF家族 微博数据监控</h1>
    <div id="updateTime" class="update-time">正在加载数据...</div>

    <div class="section-title">📈 今日个人微博数据 (增量)</div>
    <table>
        <thead>
            <tr>
                <th>标识</th>
                <th>评论增量</th>
                <th>转发增量</th>
                <th>点赞增量</th>
                <th>转赞评增量总数</th>
            </tr>
        </thead>
        <tbody id="incrementBody">
            <tr><td colspan="5" class="loading">加载中...</td></tr>
        </tbody>
    </table>

    <div class="section-title">📊 累计个人微博数据</div>
    <table>
        <thead>
            <tr>
                <th>标识</th>
                <th>粉丝数</th>
                <th>评论</th>
                <th>转发</th>
                <th>点赞</th>
                <th>转赞评总数</th>
            </tr>
        </thead>
        <tbody id="totalBody">
            <tr><td colspan="6" class="loading">加载中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // 用户列表（与 weibouid.txt 一致）
    const USER_LIST = [
        { uid: "6353131515", name: "张桂源" },
        { uid: "7740929779", name: "张函瑞" },
        { uid: "3625607515", name: "王橹杰" },
        { uid: "3448351424", name: "左奇函" },
        { uid: "6320179782", name: "陈奕恒" },
        { uid: "7817162132", name: "杨博文" },
        { uid: "3177765082", name: "陈浚铭" }
    ];

    async function loadData() {
        try {
            // 从同目录下的 data.json 读取数据（避免缓存）
            const response = await fetch('data.json?' + Date.now());
            if (!response.ok) throw new Error('无法加载 data.json');
            const json = await response.json();
            const baseline = json.baseline || {};
            const current = json.current || {};
            const updateTime = json.update_time || '';

            document.getElementById('updateTime').textContent = updateTime ? `最后更新：${updateTime}` : '暂无数据';

            const incBody = document.getElementById('incrementBody');
            const totBody = document.getElementById('totalBody');
            incBody.innerHTML = '';
            totBody.innerHTML = '';

            USER_LIST.forEach(user => {
                const base = baseline[user.uid] || {};
                const curr = current[user.uid] || {};

                const incComment = (curr.comment || 0) - (base.comment || 0);
                const incRepost = (curr.repost || 0) - (base.repost || 0);
                const incLike = (curr.like || 0) - (base.like || 0);
                const incTotal = (curr.total || 0) - (base.total || 0);

                // 增量行
                const incRow = document.createElement('tr');
                incRow.innerHTML = `
                    <td><span class="badge">${user.name}</span></td>
                    <td class="increment ${incComment < 0 ? 'negative' : ''}">${formatNumber(incComment)}</td>
                    <td class="increment ${incRepost < 0 ? 'negative' : ''}">${formatNumber(incRepost)}</td>
                    <td class="increment ${incLike < 0 ? 'negative' : ''}">${formatNumber(incLike)}</td>
                    <td class="increment ${incTotal < 0 ? 'negative' : ''}">${formatNumber(incTotal)}</td>
                `;
                incBody.appendChild(incRow);

                // 累计行
                const totRow = document.createElement('tr');
                totRow.innerHTML = `
                    <td><span class="badge">${user.name}</span></td>
                    <td>${curr.followers != null ? formatNumber(curr.followers) : '-'}</td>
                    <td>${curr.comment != null ? formatNumber(curr.comment) : '-'}</td>
                    <td>${curr.repost != null ? formatNumber(curr.repost) : '-'}</td>
                    <td>${curr.like != null ? formatNumber(curr.like) : '-'}</td>
                    <td>${curr.total != null ? formatNumber(curr.total) : '-'}</td>
                `;
                totBody.appendChild(totRow);
            });
        } catch (err) {
            console.error('加载数据失败:', err);
            document.getElementById('updateTime').textContent = '数据加载失败，请稍后重试';
        }
    }

    function formatNumber(num) {
        if (num == null) return '-';
        const abs = Math.abs(num);
        if (abs >= 1e8) return (num / 1e8).toFixed(2) + '亿';
        if (abs >= 1e4) return (num / 1e4).toFixed(1) + '万';
        return num.toLocaleString();
    }

    // 页面加载时立即获取数据，然后每10分钟刷新一次
    loadData();
    setInterval(loadData, 10 * 60 * 1000);
</script>
</body>
</html>
