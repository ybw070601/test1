<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF家族 微博数据监控</title>
    <style>
        /* 样式与之前基本一致，此处省略，可直接复用之前CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .section-title { font-size: 1.3em; color: #2c3e50; margin: 25px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #3498db; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th { background: #34495e; color: white; padding: 12px; font-weight: 500; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        .badge { background: #3498db; color: white; padding: 3px 12px; border-radius: 20px; font-size: 0.85em; }
        .increment { font-weight: 600; color: #27ae60; }
        .increment.negative { color: #e74c3c; }
        .update-time { text-align: center; color: #7f8c8d; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌟 TF家族 微博数据监控</h1>
    <div id="updateTime" class="update-time">加载中...</div>

    <h2 class="section-title">📈 今日个人微博数据 (增量)</h2>
    <table>
        <thead>
            <tr><th>标识</th><th>评论增量</th><th>转发增量</th><th>点赞增量</th><th>转赞评增量总数</th></tr>
        </thead>
        <tbody id="incrementBody"><tr><td colspan="5">加载中...</td></tr></tbody>
    </table>

    <h2 class="section-title">📊 累计个人微博数据</h2>
    <table>
        <thead>
            <tr><th>标识</th><th>粉丝数</th><th>评论</th><th>转发</th><th>点赞</th><th>转赞评总数</th></tr>
        </thead>
        <tbody id="totalBody"><tr><td colspan="6">加载中...</td></tr></tbody>
    </table>
</div>

<script>
    const USER_LIST = [
        { uid: "6353131515", name: "张桂源" },
        { uid: "7740929779", name: "张函瑞" },
        { uid: "3625607515", name: "王橹杰" },
        { uid: "3448351424", name: "左奇函" },
        { uid: "6320179782", name: "陈奕恒" },
        { uid: "7817162132", name: "杨博文" },
        { uid: "3177765082", name: "陈浚铭" }
    ];

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const json = await response.json();
            const baseline = json.baseline || {};
            const current = json.current || {};
            const updateTime = json.update_time || '';

            document.getElementById('updateTime').textContent = updateTime ? `最后更新: ${updateTime}` : '';

            const incBody = document.getElementById('incrementBody');
            const totBody = document.getElementById('totalBody');
            incBody.innerHTML = '';
            totBody.innerHTML = '';

            USER_LIST.forEach(user => {
                const base = baseline[user.uid] || {};
                const curr = current[user.uid] || {};
                const inc = {
                    comment: (curr.comment || 0) - (base.comment || 0),
                    repost: (curr.repost || 0) - (base.repost || 0),
                    like: (curr.like || 0) - (base.like || 0),
                    total: (curr.total || 0) - (base.total || 0)
                };

                const incRow = document.createElement('tr');
                incRow.innerHTML = `
                    <td><span class="badge">${user.name}</span></td>
                    <td class="increment ${inc.comment<0?'negative':''}">${formatNum(inc.comment)}</td>
                    <td class="increment ${inc.repost<0?'negative':''}">${formatNum(inc.repost)}</td>
                    <td class="increment ${inc.like<0?'negative':''}">${formatNum(inc.like)}</td>
                    <td class="increment ${inc.total<0?'negative':''}">${formatNum(inc.total)}</td>`;
                incBody.appendChild(incRow);

                const totRow = document.createElement('tr');
                totRow.innerHTML = `
                    <td><span class="badge">${user.name}</span></td>
                    <td>${curr.followers ? formatNum(curr.followers) : '-'}</td>
                    <td>${curr.comment ? formatNum(curr.comment) : '-'}</td>
                    <td>${curr.repost ? formatNum(curr.repost) : '-'}</td>
                    <td>${curr.like ? formatNum(curr.like) : '-'}</td>
                    <td>${curr.total ? formatNum(curr.total) : '-'}</td>`;
                totBody.appendChild(totRow);
            });
        } catch (e) {
            console.error('加载数据失败:', e);
        }
    }

    function formatNum(num) {
        if (num === null || num === undefined) return '-';
        if (Math.abs(num) >= 1e8) return (num/1e8).toFixed(2)+'亿';
        if (Math.abs(num) >= 1e4) return (num/1e4).toFixed(1)+'万';
        return num.toLocaleString();
    }

    loadData();
    setInterval(loadData, 10 * 60 * 1000); // 每10分钟刷新
</script>
</body>
</html>
