name: Update Weibo Data

on:
  schedule:
    # 每10分钟执行一次 (UTC 时间)
    - cron: '*/10 * * * *'
  workflow_dispatch:   # 支持手动触发

env:
  # 强制 Actions 使用 Node.js 24 以避免弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python scripts/fetch_weibo.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "🔄 自动更新微博数据 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" && git push)
