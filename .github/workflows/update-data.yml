name: Update Weibo Data

on:
  schedule:
    # 每10分钟运行一次（UTC时间，需要自行换算，例如北京时间0:00对应UTC 16:00）
    - cron: '*/10 * * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python scripts/fetch_weibo.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "🔄 自动更新微博数据 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" && git push)
